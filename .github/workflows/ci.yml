name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm-lock.yaml is committed yet, so the lockfile is resolved fresh.
      # Once pnpm-lock.yaml is committed, switch to `pnpm install --frozen-lockfile`
      # and add `cache: pnpm` to setup-node.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Eval
        run: pnpm eval
